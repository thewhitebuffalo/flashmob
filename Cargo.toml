[package]
name = "flashmob"
version = "0.1.0"
edition = "2021"
# eframe/egui 0.36 (the gui feature) declare rust-version 1.95; clap 4.6 needs 1.85.
rust-version = "1.95"
description = "Load flow, short circuit, coordination, and IEEE 1584-2018 arc flash studies"
license = "MIT"
readme = "README.md"

[features]
default = ["gui", "bundle-library"]
gui = ["dep:eframe", "dep:rfd"]
# The device library JSON is compiled into the program.
bundle-library = []

[dependencies]
clap = { version = "4", features = ["derive"] }
faer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = [".", "flashmob-mcp"]
resolver = "2"
